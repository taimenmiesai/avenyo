<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avenyo – kohdeyleisö: ääripäät</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">

<body>

<div style="font-size: 13px; color: #B8BAC4">Asiakasdatan käyttöjärjestelmä</div>
</div>
<nav aria-label="Päävalikko" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="index.html" style="color: #D6D7DD; text-decoration: none; font-size: 14px; padding: 10px 14px">Yleiskuva</a>
<a href="segmentit.html" style="color: #D6D7DD; text-decoration: none; font-size: 14px; padding: 10px 14px">Asiakkaat</a>
<a href="aikakone.html" style="color: #D6D7DD; text-decoration: none; font-size: 14px; padding: 10px 14px">Aikakone</a>

<main style="max-width: 1320px; margin: 0 auto; padding: 28px 32px 56px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">

<h1 style="margin: 6px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 40px; line-height: 1.1; font-weight: 700">Ääripäät: 10 hyvin erilaista ostohistoriaa</h1>
<p style="margin: 8px 0 0; font-size: 15px; color: #3A3C47; max-width: 760px">Koko pikaruokavalikoima kahvista ja aamiaisesta perhe- ja ryhmäpaketteihin. Valitse asiakas kartalta tai listasta nähdäksesi koko ostohistorian.</p>
</div>
</div>

<section aria-label="Toiminnot" style="background: #FFFFFF; border: 2px solid #111218; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px">

</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<template data-sc="for" list="{{ actBtns }}" as="b" hint-placeholder-count="3">
<button type="button" onClick="{{ b.pick }}" aria-pressed="{{ b.on }}" aria-expanded="{{ b.on }}" style="{{ b.style }}">
<template data-sc="if" value="{{ b.isA }}" hint-placeholder-val="{{ true }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
</template>
<template data-sc="if" value="{{ b.isB }}" hint-placeholder-val="{{ false }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.5"></circle></svg>

</template>

</button>
</template>
</div>
</div>
<template data-sc="if" value="{{ act.open }}" hint-placeholder-val="{{ false }}">

<div style="display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: flex-start">
<div style="flex: 1 1 360px; min-width: 0">

</div>
<button type="button" aria-label="Sulje" onClick="{{ act.close }}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #C9CCDA; background: #FFFFFF; color: #111218; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</button>

<template data-sc="if" value="{{ act.isLa }}" hint-placeholder-val="{{ false }}">

<template data-sc="for" list="{{ act.rows }}" as="r" hint-placeholder-count="4">
<div style="background: #F8F7F3; border-radius: 10px; padding: 10px 12px">
<dt style="font-size: 12px; color: #5B5D66">{{ r.k }}</dt>
<dd style="margin: 2px 0 0; font-weight: 600; font-size: 15px; line-height: 1.4">{{ r.v }}</dd>
</div>
</template>
</dl>
<template data-sc="if" value="{{ act.done }}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; gap: 10px; align-items: center; background: #E6EBFF; color: #1D3FC4; border-radius: 12px; padding: 12px 14px; font-weight: 600; font-size: 14px">

<span>{{ act.doneText }}</span>
</div>
</template>
<template data-sc="if" value="{{ act.notDone }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button type="button" onClick="{{ act.confirm }}" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: #2447D6; color: #FFFFFF; cursor: pointer; font-weight: 700; font-size: 15px">{{ act.confirmLabel }}</button>
<button type="button" onClick="{{ act.close }}" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1px solid #C9CCDA; background: #FFFFFF; color: #111218; cursor: pointer; font-weight: 600; font-size: 15px">Peruuta</button>
</div>
</template>
</div>
</template>
</section>


<section aria-label="Yhteenveto" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<template data-sc="for" list="{{ summary }}" as="k" hint-placeholder-count="4">

<span style="font-size: 14px; color: #5B5D66">{{ k.label }}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700">{{ k.value }}</span>
<span style="font-size: 12px; color: #5B5D66">{{ k.note }}</span>
</div>
</template>
</section>

<section style="display: flex; flex-wrap: wrap; gap: 12px">
<div style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 16px; border: 1px solid #E4E1DA; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Ostokäyttäytymisen kartta</h2>
<div style="font-size: 13px; color: #5B5D66; margin-top: 4px">Vaaka: ostoja kuukaudessa · Pysty: keskiostos · Pallon koko: CLV-ennuste. Molemmat akselit logaritmisia.</div>
</div>
<div style="display: flex; gap: 8px">
<div style="position: relative; width: 44px; height: 600px; font-size: 12px; color: #5B5D66">

</div>
<div style="flex: 1; min-width: 0">
<div style="position: relative; height: 600px; border-left: 1px solid #D9D6CE; border-bottom: 1px solid #D9D6CE; background: #FBFAF7; border-radius: 0 10px 0 0">
<span style="position: absolute; left: 10px; top: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #5B5D66">HARVOIN · ISOT OSTOT</span>
<span style="position: absolute; right: 10px; bottom: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #5B5D66">USEIN · PIENET OSTOT</span>
<template data-sc="for" list="{{ xTicks }}" as="t" hint-placeholder-count="4"><span style="{{ t.line }}"></span></template>
<template data-sc="for" list="{{ yTicks }}" as="t" hint-placeholder-count="5"><span style="{{ t.line }}"></span></template>
<template data-sc="for" list="{{ dots }}" as="d" hint-placeholder-count="10">
<button type="button" onClick="{{ d.pick }}" aria-pressed="{{ d.on }}" aria-label="{{ d.aria }}" style="{{ d.style }}">{{ d.initials }}</button>
</template>
</div>
<div style="position: relative; height: 22px; font-size: 12px; color: #5B5D66">
<template data-sc="for" list="{{ xTicks }}" as="t" hint-placeholder-count="4"><span style="{{ t.style }}">{{ t.label }}</span></template>
</div>
</div>
</div>
</div>

<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 4px; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Asiakkaat</h2>
<template data-sc="for" list="{{ list }}" as="c" hint-placeholder-count="10">
<button type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.on }}" style="{{ c.style }}">

<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
<span style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline">
<span style="font-weight: 700; font-size: 15px">{{ c.persona }}</span>
<span style="font-size: 12px; color: #5B5D66; white-space: nowrap">{{ c.name }}</span>
</span>
<span style="display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: #F0EEE9">
<template data-sc="for" list="{{ c.mix }}" as="m" hint-placeholder-count="3"><span style="{{ m.style }}"></span></template>
</span>
<span style="font-size: 12px; color: #5B5D66">{{ c.line }}</span>
</span>
</button>
</template>
</div>
</section>

<section aria-labelledby="profiili" style="background: #FFFFFF; border-radius: 16px; border: 1px solid #E4E1DA; padding: 24px 26px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between">
<div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap">
<span style="{{ sel.avatar }}">{{ sel.initials }}</span>
<div>
<div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap">

<span style="{{ sel.extStyle }}">{{ sel.ext }}</span>
</div>
<div style="font-size: 14px; color: #5B5D66; margin-top: 4px">{{ sel.name }} · {{ sel.id }} · {{ sel.since }}</div>

</div>
<div style="display: flex; gap: 8px">

<button type="button" onClick="{{ nextC }}" aria-label="Seuraava asiakas" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #C9CCDA; background: #FFFFFF; cursor: pointer; color: #111218; font-size: 18px">→</button>

<div style="background: #F8F7F3; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5B5D66">{{ k.label }}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">{{ k.value }}</span>
</div>
</template>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px">

</div>
</template>
</div>
<div style="display: flex; gap: 6px; font-size: 11px; color: #5B5D66">
<template data-sc="for" list="{{ monthLabels }}" as="l" hint-placeholder-count="12"><span style="flex: 1; text-align: center">{{ l }}</span></template>
</div>
</div>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 16px; font-weight: 700">Ostoajat</h3>
<template data-sc="for" list="{{ sel.times }}" as="t" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px">
<span style="width: 120px; flex: none">{{ t.label }}</span>
<span style="flex: 1; height: 10px; border-radius: 999px; background: #F0EEE9; overflow: hidden"><span style="{{ t.style }}"></span></span>
<span style="width: 40px; text-align: right; font-weight: 600">{{ t.v }} %</span>
</div>
</template>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h3 style="margin: 0; font-size: 16px; font-weight: 700">Tuotekategoriat</h3>
<div style="display: flex; height: 22px; border-radius: 8px; overflow: hidden; background: #F0EEE9">
<template data-sc="for" list="{{ sel.mix }}" as="m" hint-placeholder-count="4"><span style="{{ m.style }}"></span></template>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; font-size: 13px">
<template data-sc="for" list="{{ sel.mix }}" as="m" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 8px"><span style="{{ m.swatch }}"></span><span style="flex: 1">{{ m.label }}</span><span style="font-weight: 600">{{ m.v }} %</span></li>
</template>
</ul>
</div>
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 16px; font-weight: 700">Ostetuimmat tuotteet, 12 kk</h3>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<template data-sc="for" list="{{ sel.top }}" as="p" hint-placeholder-count="4">
<li style="display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 10px 12px; background: #F8F7F3; border-radius: 10px"><span>{{ p.name }}</span><span style="font-weight: 700">{{ p.n }} krt</span></li>
</template>
</ol>
</div>
<div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 16px; font-weight: 700">Ostokanava</h3>
<template data-sc="for" list="{{ sel.channels }}" as="ch" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px">
<div style="display: flex; justify-content: space-between"><span>{{ ch.label }}</span><span style="font-weight: 600">{{ ch.v }} %</span></div>
<div style="height: 8px; border-radius: 999px; background: #F0EEE9; overflow: hidden"><div style="{{ ch.style }}"></div></div>
</div>
</template>
</div>
</div>

<div style="background: #111218; color: #FFFFFF; border-radius: 14px; padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between">
<div style="flex: 1 1 420px; min-width: 0">
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #B8BAC4">SUOSITELTU TOIMENPIDE</div>
<div style="font-size: 17px; font-weight: 600; margin-top: 4px; line-height: 1.4">{{ sel.action }}</div>
</div>
<button type="button" onClick="{{ openLa }}" style="min-height: 48px; padding: 0 18px; border-radius: 999px; border: 0; background: #FFFFFF; color: #111218; cursor: pointer; font-weight: 700">Luo look-alike tästä profiilista</button>
</div>
</section>

<div style="font-size: 12px; color: #5B5D66">Demodata – asiakkaat ja ostohistoriat ovat keksittyjä esimerkkejä.</div>
</main>
</div>
</template>
