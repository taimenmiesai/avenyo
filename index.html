<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avenyo – alkunäkymä</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F2EE}
a{color:#2447D6}a:hover{color:#1A33A0}
button{font:inherit}
</style>
<script src="assets/runtime.js" defer></script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<div style="min-height: 100vh; background: #F4F2EE; color: #111218; font-family: Inter, system-ui, sans-serif; box-sizing: border-box">

<header style="background: #111218; color: #FFFFFF">
<div style="position: relative; max-width: 1320px; margin: 0 auto; padding: 18px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px">
<div style="display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap">
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 0.12em">AVENYO</div>
<div style="font-size: 13px; color: #B8BAC4">Asiakasdatan käyttöjärjestelmä</div>
</div>
<nav aria-label="Päävalikko" style="display: flex; flex-wrap: wrap; gap: 4px">
<a href="#" aria-current="page" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600; padding: 10px 14px; border-radius: 999px; background: #2A2C36">Yleiskuva</a>
<a href="segmentit.html" style="color: #D6D7DD; text-decoration: none; font-size: 14px; padding: 10px 14px">Asiakkaat</a>
<a href="aikakone.html" style="color: #D6D7DD; text-decoration: none; font-size: 14px; padding: 10px 14px">Aikakone</a>
<a href="kohdeyleiso.html" style="color: #D6D7DD; text-decoration: none; font-size: 14px; padding: 10px 14px">Kohdeyleisöt</a>
<a href="#" style="color: #D6D7DD; text-decoration: none; font-size: 14px; padding: 10px 14px">Kampanjat</a>
<a href="#" style="color: #D6D7DD; text-decoration: none; font-size: 14px; padding: 10px 14px">Tuotteet</a>
<a href="#" style="color: #D6D7DD; text-decoration: none; font-size: 14px; padding: 10px 14px">Raportit</a>
</nav>
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" onClick="{{ dp.toggle }}" aria-expanded="{{ dp.open }}" aria-haspopup="dialog" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 14px; border-radius: 12px; border: 1px solid #4A4C58; background: #1D1F29; color: #FFFFFF; cursor: pointer; text-align: left; font: inherit">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>
<span style="display: flex; flex-direction: column; line-height: 1.25">
<span style="font-size: 11px; color: #B8BAC4">{{ dp.presetLabel }}</span>
<span style="font-size: 14px; font-weight: 600">{{ dp.label }}</span>
<template data-sc="if" value="{{ dp.cmpOn }}" hint-placeholder-val="{{ true }}">
<span style="font-size: 12px; color: #F5A98A">vs. {{ dp.cmpLabel }}</span>
</template>
</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<template data-sc="if" value="{{ dp.open }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="Sulje aikavälin valinta" onClick="{{ dp.close }}" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(17,18,24,0.18); border: 0; z-index: 40; cursor: default"></button>
<div role="dialog" aria-label="Valitse aikaväli" style="position: absolute; top: calc(100% - 4px); right: 16px; z-index: 50; width: 700px; max-width: calc(100% - 32px); background: #FFFFFF; color: #111218; border-radius: 16px; box-shadow: 0 24px 64px rgba(17,18,24,0.30); display: flex; flex-wrap: wrap; overflow: hidden; font-family: Inter, system-ui, sans-serif">

<div style="flex: 1 1 230px; min-width: 0; border-right: 1px solid #ECEAE4; display: flex; flex-direction: column">
<div style="padding: 8px 0; display: flex; flex-direction: column; max-height: 470px; overflow-y: auto">
<template data-sc="for" list="{{ dp.presets }}" as="p" hint-placeholder-count="14">
<button type="button" onClick="{{ p.pick }}" aria-pressed="{{ p.on }}" style="{{ p.style }}">{{ p.label }}</button>
</template>
</div>
<div style="border-top: 1px solid #ECEAE4; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
<span id="vertaa-otsikko" style="font-size: 14px; font-weight: 600">Vertaa</span>
<button type="button" role="switch" aria-checked="{{ dp.dCmpOn }}" aria-labelledby="vertaa-otsikko" onClick="{{ dp.toggleCmp }}" style="{{ dp.switchStyle }}"><span style="{{ dp.knobStyle }}"></span></button>
</div>
<template data-sc="if" value="{{ dp.dCmpOn }}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Vertailujakso" style="display: flex; gap: 6px; flex-wrap: wrap">
<template data-sc="for" list="{{ dp.modes }}" as="m" hint-placeholder-count="3">
<button type="button" onClick="{{ m.pick }}" aria-pressed="{{ m.on }}" style="{{ m.style }}">{{ m.label }}</button>
</template>
</div>
</template>
</div>
</div>

<div style="flex: 999 1 380px; min-width: 0; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: flex-end; gap: 8px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<label for="dp-alku" style="font-size: 12px; font-weight: 600; color: #1D3FC4">Alkamispäivä</label>
<input id="dp-alku" type="text" inputmode="numeric" value="{{ dp.fStart.value }}" onFocus="{{ dp.fStart.focus }}" onChange="{{ dp.fStart.change }}" style="{{ dp.fStart.style }}">
</div>
<span aria-hidden="true" style="padding-bottom: 12px; color: #5B5D66">–</span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<label for="dp-loppu" style="font-size: 12px; font-weight: 600; color: #1D3FC4">Päättymispäivä</label>
<input id="dp-loppu" type="text" inputmode="numeric" value="{{ dp.fEnd.value }}" onFocus="{{ dp.fEnd.focus }}" onChange="{{ dp.fEnd.change }}" style="{{ dp.fEnd.style }}">
</div>
</div>
<template data-sc="if" value="{{ dp.dCmpOn }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-end; gap: 8px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<label for="dp-valku" style="font-size: 12px; font-weight: 600; color: #A3360F">Vertailu alkaa</label>
<input id="dp-valku" type="text" inputmode="numeric" value="{{ dp.fCs.value }}" onFocus="{{ dp.fCs.focus }}" onChange="{{ dp.fCs.change }}" style="{{ dp.fCs.style }}">
</div>
<span aria-hidden="true" style="padding-bottom: 12px; color: #5B5D66">–</span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<label for="dp-vloppu" style="font-size: 12px; font-weight: 600; color: #A3360F">Vertailu päättyy</label>
<input id="dp-vloppu" type="text" inputmode="numeric" value="{{ dp.fCe.value }}" onFocus="{{ dp.fCe.focus }}" onChange="{{ dp.fCe.change }}" style="{{ dp.fCe.style }}">
</div>
</div>
</template>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); width: 100%; max-width: 308px; gap: 0; font-size: 12px; font-weight: 600; color: #5B5D66; text-align: center">
<span>M</span><span>T</span><span>K</span><span>T</span><span>P</span><span>L</span><span>S</span>
</div>
<div style="display: flex; gap: 4px">
<button type="button" onClick="{{ dp.prevMonth }}" aria-label="Aiempi kuukausi" style="width: 36px; height: 36px; border-radius: 999px; border: 1px solid #D9D6CE; background: #FFFFFF; cursor: pointer; color: #111218; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button>
<button type="button" onClick="{{ dp.nextMonth }}" disabled="{{ dp.noNext }}" aria-label="Seuraava kuukausi" style="width: 36px; height: 36px; border-radius: 999px; border: 1px solid #D9D6CE; background: #FFFFFF; cursor: pointer; color: #111218; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
</div>

<template data-sc="for" list="{{ dp.months }}" as="mo" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #3A3C47">{{ mo.title }}</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); max-width: 308px; gap: 2px 0">
<template data-sc="for" list="{{ mo.cells }}" as="c" hint-placeholder-count="30">
<template data-sc="if" value="{{ c.blank }}" hint-placeholder-val="{{ false }}"><span></span></template>
<template data-sc="if" value="{{ c.real }}" hint-placeholder-val="{{ true }}">
<span style="{{ c.wrap }}"><button type="button" onClick="{{ c.pick }}" disabled="{{ c.disabled }}" aria-label="{{ c.aria }}" aria-pressed="{{ c.sel }}" style="{{ c.btn }}">{{ c.d }}</button></span>
</template>
</template>
</div>
</div>
</template>

<div style="border-top: 1px solid #ECEAE4; padding-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between">
<div style="font-size: 12px; color: #5B5D66; line-height: 1.4">
<div style="font-weight: 600; color: #111218">{{ dp.draftLabel }}</div>
<div>{{ dp.draftCmp }}</div>
</div>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{ dp.close }}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; color: #1D3FC4; cursor: pointer; font-weight: 600">Peru</button>
<button type="button" onClick="{{ dp.apply }}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: #2447D6; color: #FFFFFF; cursor: pointer; font-weight: 700">Käytä</button>
</div>
</div>
</div>
</div>
</template>

<button type="button" aria-label="Oma profiili" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: {{ accent }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
</button>
</div>
</div>
</header>

<main style="max-width: 1320px; margin: 0 auto; padding: 36px 32px 56px; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box">

<section aria-labelledby="valinta" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px">
<div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #5B5D66">YLEISKUVA · {{ dp.eyebrow }}</div>
<h1 style="margin: 6px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em">{{ role.headline }}</h1>
</div>
<div id="valinta" style="font-size: 14px; color: #5B5D66">Valitse näkymä roolisi mukaan</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
<template data-sc="for" list="{{ roles }}" as="r" hint-placeholder-count="3">
<button type="button" onClick="{{ r.pick }}" aria-pressed="{{ r.pressed }}" style="{{ r.btnStyle }}">
<span style="{{ r.iconStyle }}">
<template data-sc="if" value="{{ r.isCrm }}" hint-placeholder-val="{{ true }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M17 14.5c2.6 0 4.5 1.6 4.5 4.5"></path></svg>
</template>
<template data-sc="if" value="{{ r.isMkt }}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
</template>
<template data-sc="if" value="{{ r.isFin }}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg>
</template>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">{{ r.title }}</span>
<span style="font-size: 13px; color: #5B5D66">{{ r.desc }}</span>
</span>
</button>
</template>
</div>
</section>

<section aria-label="Tunnusluvut" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<template data-sc="for" list="{{ role.kpis }}" as="k" hint-placeholder-count="4">
<div style="background: #FFFFFF; border-radius: 16px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #E4E1DA">
<div style="font-size: 14px; color: #5B5D66; font-weight: 500">{{ k.label }}</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1">{{ k.value }}</div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<template data-sc="if" value="{{ dp.cmpOn }}" hint-placeholder-val="{{ true }}">
<span style="{{ k.deltaStyle }}">{{ k.arrow }} {{ k.delta }}</span>
<span style="font-size: 12px; color: #5B5D66">vs. {{ dp.cmpLabel }}</span>
</template>
<template data-sc="if" value="{{ dp.cmpOff }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; color: #5B5D66">{{ dp.label }}</span>
</template>
</div>
</div>
</template>
</section>

<section style="display: flex; flex-wrap: wrap; gap: 12px">
<div style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 22px 24px; border: 1px solid #E4E1DA; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start">
<div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">{{ role.chartTitle }}</h2>
<div style="font-size: 13px; color: #5B5D66; margin-top: 4px">{{ role.chartSub }}</div>
</div>
<div style="display: flex; gap: 16px; font-size: 13px; color: #3A3C47; flex-wrap: wrap">
<span style="display: flex; align-items: center; gap: 6px"><span style="{{ legendNow }}"></span>{{ dp.label }}</span>
<template data-sc="if" value="{{ dp.cmpOn }}" hint-placeholder-val="{{ true }}">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 0; border-top: 2px dashed #8E919C"></span>{{ dp.cmpLabel }}</span>
</template>
</div>
</div>
<div style="display: flex; gap: 10px">
<div style="display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; color: #5B5D66; padding: 10px 0 0; height: 200px; text-align: right; min-width: 40px">
<span>{{ chart.yMax }}</span><span>{{ chart.yMid }}</span><span>{{ chart.yMin }}</span>
</div>
<div style="flex: 1; min-width: 0">
<svg viewBox="0 0 600 210" preserveAspectRatio="none" role="img" aria-label="{{ chart.aria }}" style="width: 100%; height: 210px; display: block">
<line x1="0" y1="20" x2="600" y2="20" stroke="#ECEAE4" stroke-width="1" vector-effect="non-scaling-stroke"></line>
<line x1="0" y1="110" x2="600" y2="110" stroke="#ECEAE4" stroke-width="1" vector-effect="non-scaling-stroke"></line>
<line x1="0" y1="200" x2="600" y2="200" stroke="#D9D6CE" stroke-width="1" vector-effect="non-scaling-stroke"></line>
<path d="{{ chart.area }}" fill="{{ accent }}" fill-opacity="0.10"></path>
<path d="{{ chart.prev }}" fill="none" stroke="#8E919C" stroke-opacity="{{ chart.prevOpacity }}" stroke-width="2" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"></path>
<path d="{{ chart.line }}" fill="none" stroke="{{ accent }}" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
</svg>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #5B5D66; margin-top: 8px">
<template data-sc="for" list="{{ weeks }}" as="w" hint-placeholder-count="12"><span>{{ w }}</span></template>
</div>
</div>
</div>
</div>

<div style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 22px 24px; border: 1px solid #E4E1DA; display: flex; flex-direction: column; gap: 18px">
<div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">{{ role.splitTitle }}</h2>
<div style="font-size: 13px; color: #5B5D66; margin-top: 4px">{{ role.splitSub }}</div>
<template data-sc="if" value="{{ isCrm }}" hint-placeholder-val="{{ true }}">
<a href="segmentit.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 600; text-decoration: none">Avaa segmentit →</a>
</template>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<template data-sc="for" list="{{ split }}" as="s" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 14px; gap: 8px">
<span style="font-weight: 600">{{ s.label }}</span>
<span style="color: #3A3C47">{{ s.value }} · {{ s.pct }} %</span>
</div>
<div style="height: 10px; border-radius: 999px; background: #F0EEE9; overflow: hidden">
<div style="{{ s.barStyle }}"></div>
</div>
</div>
</template>
</div>
</div>
</section>

<section aria-labelledby="ateriat" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px">
<h2 id="ateriat" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">Ateriat</h2>
<div style="font-size: 14px; color: #5B5D66">Mittari: <strong style="color: #111218">{{ role.mealMetric }}</strong></div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px">
<template data-sc="for" list="{{ meals }}" as="m" hint-placeholder-count="5">
<div style="background: #FFFFFF; border-radius: 16px; padding: 18px 20px 20px; border: 1px solid #E4E1DA; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
<div style="width: 80px; height: 64px; border-radius: 12px; background: #FBF4E8; display: flex; align-items: center; justify-content: center">
<svg width="60" height="48" viewBox="0 0 72 56" aria-hidden="true">
<path d="M8 24 C8 11 21 4 36 4 C51 4 64 11 64 24 Z" fill="#E6A03A"></path>
<ellipse cx="26" cy="13" rx="2" ry="1.2" fill="#FFF1D2"></ellipse>
<ellipse cx="38" cy="10" rx="2" ry="1.2" fill="#FFF1D2"></ellipse>
<ellipse cx="47" cy="16" rx="2" ry="1.2" fill="#FFF1D2"></ellipse>
<path d="M5 27 Q11 23 17 27 T29 27 T41 27 T53 27 T67 27 L67 30 L5 30 Z" fill="{{ m.leaf }}"></path>
<path d="M8 30 H64 L57 36 L50 30 Z" fill="{{ m.cheese }}"></path>
<rect x="7" y="31" width="58" height="9" rx="4.5" fill="{{ m.patty }}"></rect>
<path d="M8 42 H64 V45 C64 49.5 60.5 52 56 52 H16 C11.5 52 8 49.5 8 45 Z" fill="#D2872B"></path>
</svg>
</div>
<template data-sc="if" value="{{ m.hasTag }}" hint-placeholder-val="{{ false }}">
<span style="{{ m.tagStyle }}">{{ m.tag }}</span>
</template>
</div>
<div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">{{ m.name }}</div>
<div style="font-size: 13px; color: #5B5D66; margin-top: 2px">Myyty {{ m.units }} kpl</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-size: 13px; color: #5B5D66">{{ role.mealShort }}</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">{{ m.value }}</span>
</div>
<div style="height: 8px; border-radius: 999px; background: #F0EEE9; overflow: hidden">
<div style="{{ m.barStyle }}"></div>
</div>
<div style="font-size: 12px; color: #5B5D66">{{ m.sub }}</div>
</div>
</div>
</template>
</div>
</section>
